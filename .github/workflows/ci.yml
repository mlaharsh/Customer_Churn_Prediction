name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py churn
      - name: Run tests
        run: python -m pytest -q

  train:
    name: Rebuild artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Train a small reproducibility run
        run: python -m churn.train --cv-splits 2 --no-figures
      - name: Verify exported artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path("models/churn_model.joblib"),
              Path("models/metrics.json"),
              Path("reports/evaluation/test_predictions.csv"),
              Path("reports/evaluation/risk_deciles.csv"),
              Path("reports/evaluation/model_comparison.csv"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"Missing artifacts: {missing}")
          print("Training artifacts verified")
          PY

  app-smoke:
    name: Streamlit smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Start app and check health endpoint
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          APP_PID=$!
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Streamlit did not become healthy"
            kill "$APP_PID" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8501/_stcore/health
          kill "$APP_PID" || true
