[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-signal"
version = "1.0.0"
description = "Reproducible customer churn prediction and retention workbench for the IBM Telco dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MLA Harsh" }]
keywords = ["churn", "machine-learning", "streamlit", "scikit-learn", "customer-retention"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<1.7",
    "joblib>=1.3,<2.0",
    "streamlit>=1.50,<2.0",
    "plotly>=5.20,<7.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.urls]
Homepage = "https://mlaharsh.github.io/Customer_Churn_Prediction/"
Repository = "https://github.com/mlaharsh/Customer_Churn_Prediction"
Issues = "https://github.com/mlaharsh/Customer_Churn_Prediction/issues"

[tool.setuptools.packages.find]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
